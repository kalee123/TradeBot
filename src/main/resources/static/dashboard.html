<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TradeBot Dashboard</title>
<style>
    :root {
        --bg: #f5f6f8;
        --card: #ffffff;
        --text: #1d2330;
        --muted: #6b7280;
        --border: #e3e6eb;
        --accent: #2563eb;
        --pos: #15803d;
        --neg: #b91c1c;
    }
    @media (prefers-color-scheme: dark) {
        :root {
            --bg: #0f1218;
            --card: #181c24;
            --text: #e6e8ec;
            --muted: #9aa3b2;
            --border: #2a303b;
            --accent: #60a5fa;
            --pos: #4ade80;
            --neg: #f87171;
        }
    }
    * { box-sizing: border-box; }
    body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 24px;
        background: var(--card);
        border-bottom: 1px solid var(--border);
    }
    header h1 { margin: 0; font-size: 18px; }
    main { max-width: 1000px; margin: 0 auto; padding: 24px 16px; }
    .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
    .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 18px 20px;
    }
    .card h2 { margin: 0 0 12px; font-size: 15px; }
    .big { font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
    dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; margin: 12px 0 0; }
    dt { color: var(--muted); }
    dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
    .chip {
        padding: 2px 10px;
        border: 1px solid var(--border);
        border-radius: 999px;
        font-size: 12px;
    }
    .pos { color: var(--pos); }
    .neg { color: var(--neg); }
    .status { color: var(--muted); padding: 40px 0; text-align: center; }
    .muted { color: var(--muted); }
    a { color: var(--accent); }
</style>
</head>
<body>
<header>
    <h1>TradeBot</h1>
    <span id="who" class="muted"></span>
</header>

<main>
    <div id="status" class="status">Loading…</div>
    <div id="content" hidden>
        <div class="grid">
            <section class="card" id="profile"></section>
            <section class="card" id="equity"></section>
            <section class="card" id="commodity"></section>
        </div>
    </div>
</main>

<script>
    const inr = new Intl.NumberFormat("en-IN", { style: "currency", currency: "INR", maximumFractionDigits: 2 });

    function money(value) {
        return inr.format(Number(value) || 0);
    }

    function escapeHtml(value) {
        return String(value ?? "").replace(/[&<>"']/g, c => ({
            "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
        })[c]);
    }

    function renderProfile(p) {
        document.getElementById("who").textContent = `${p.user_name || ""} · ${p.user_id || ""}`;
        const chips = (p.exchanges || []).map(e => `<span class="chip">${escapeHtml(e)}</span>`).join("");
        document.getElementById("profile").innerHTML = `
            <h2>Profile</h2>
            <div class="big">${escapeHtml(p.user_name)}</div>
            <div class="muted">${escapeHtml(p.email)}</div>
            <dl>
                <dt>User ID</dt><dd>${escapeHtml(p.user_id)}</dd>
                <dt>Broker</dt><dd>${escapeHtml(p.broker)}</dd>
                <dt>Account type</dt><dd>${escapeHtml(p.user_type)}</dd>
            </dl>
            <p class="label" style="margin:14px 0 0">Exchanges</p>
            <div class="chips">${chips || '<span class="muted">None</span>'}</div>`;
    }

    function renderSegment(elementId, title, seg) {
        const el = document.getElementById(elementId);
        if (!seg || seg.enabled === false) {
            el.innerHTML = `<h2>${title}</h2><p class="muted">Segment not enabled</p>`;
            return;
        }
        const available = seg.available || {};
        const utilised = seg.utilised || {};
        const m2m = Number(utilised.m2m_unrealised) || 0;
        el.innerHTML = `
            <h2>${title} margin</h2>
            <p class="label" style="margin:0">Available</p>
            <div class="big">${money(seg.net)}</div>
            <dl>
                <dt>Cash</dt><dd>${money(available.cash)}</dd>
                <dt>Opening balance</dt><dd>${money(available.opening_balance)}</dd>
                <dt>Collateral</dt><dd>${money(available.collateral)}</dd>
                <dt>Used (debits)</dt><dd>${money(utilised.debits)}</dd>
                <dt>Unrealised M2M</dt><dd class="${m2m >= 0 ? "pos" : "neg"}">${money(m2m)}</dd>
            </dl>`;
    }

    async function load() {
        const status = document.getElementById("status");
        try {
            const res = await fetch("/api/dashboard", { headers: { Accept: "application/json" } });
            if (res.status === 401) {
                // Session expired (Kite tokens reset daily at 6 AM IST)
                window.location.href = "/login";
                return;
            }
            if (!res.ok) {
                throw new Error("HTTP " + res.status);
            }
            const data = await res.json();
            renderProfile(data.profile_details || {});
            renderSegment("equity", "Equity", (data.margin_details || {}).equity);
            renderSegment("commodity", "Commodity", (data.margin_details || {}).commodity);
            status.hidden = true;
            document.getElementById("content").hidden = false;
        } catch (e) {
            status.innerHTML = 'Could not load dashboard. <a href="">Try again</a>';
        }
    }

    load();
</script>
</body>
</html>
