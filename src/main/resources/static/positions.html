<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Positions · AlgoDesk</title>
<link rel="stylesheet" href="/css/app.css">
</head>
<body data-page="positions">
<header id="app-nav" class="navbar"></header>

<main>
    <h1 class="page-title">Positions</h1>
    <div id="status" class="status">Loading…</div>
    <div id="content" hidden>
        <div class="grid summary">
            <section class="card">
                <p class="label">Total P&amp;L</p>
                <div class="big" id="total-pnl"></div>
            </section>
            <section class="card">
                <p class="label">Open positions</p>
                <div class="big" id="open-count"></div>
            </section>
        </div>
        <div class="table-wrap">
            <table>
                <thead>
                <tr>
                    <th>Product</th>
                    <th>Instrument</th>
                    <th class="num">Qty</th>
                    <th class="num">Avg.</th>
                    <th class="num">LTP</th>
                    <th class="num">P&amp;L</th>
                </tr>
                </thead>
                <tbody id="positions-body"></tbody>
            </table>
        </div>
    </div>
</main>

<script src="/js/common.js"></script>
<script src="/js/positions.js"></script>
</body>
</html>
