kite:
  api-key: ${KITE_API_KEY}
  api-secret: ${KITE_API_SECRET}
  user-id: QEX463
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/trade_db?currentSchema=tradedb
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update     # use 'validate' once schema is stable
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
